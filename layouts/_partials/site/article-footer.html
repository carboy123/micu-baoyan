{{ with .Params.sources }}
<section class="article-sources">
  <h2>官方依据</h2>
  <p>请按适用年度核对正式通知。以下官方链接需联网访问。</p><ul>{{ range . }}<li><a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .title }} ↗</a></li>{{ end }}</ul>
</section>
{{ end }}
<div class="article-end">{{ if eq .Type "experience" }}<a data-experience-return href="{{ "experiences/" | relURL }}">← 返回面试与申请经验</a>{{ else }}<a href="{{ if .Parent }}{{ .Parent.RelPermalink }}{{ else }}{{ site.Home.RelPermalink }}{{ end }}">← 返回{{ with .Parent }}{{ .Title }}{{ else }}首页{{ end }}</a>{{ end }}<button class="text-button" data-print>{{ partial "site/icon.html" "file" }} 打印本页</button></div>
