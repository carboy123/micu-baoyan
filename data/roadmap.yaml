- id: stage-1
  label: 大一
  title: 先把基础打牢
  description: 了解本校规则，重视课程、英语与专业基础。
  output: 本校规则摘要 · 学期计划
  link: basics/roadmap/#stage-1
- id: stage-2
  label: 大二
  title: 在实践中积累
  description: 稳定成绩，选择竞赛与项目，记录自己的贡献。
  output: 项目过程记录 · 个人贡献说明
  link: basics/roadmap/#stage-2
- id: stage-3
  label: 大三上
  title: 让方向逐渐清晰
  description: 整理已有经历，了解研究方向与目标院校。
  output: 第一版简历 · 目标院校
  link: basics/roadmap/#stage-3
- id: stage-4
  label: 大三下至暑假
  title: 为申请做好准备
  description: 跟进官方通知，准备材料，练习专业与项目表达。
  output: 申请材料包 · 项目介绍
  link: basics/roadmap/#stage-4
- id: stage-5
  label: 申请季
  title: 把每一步确认好
  description: 跟进校内资格、院校考核与系统确认事项。
  output: 跟进申请 · 确认结果
  link: basics/roadmap/#stage-5
- id: stage-6
  label: 拟录取后
  title: 从容迎接下一程
  description: 完成本科学业，关注后续审核，规划入学前学习。
  output: 毕业任务计划 · 入学准备计划
  link: basics/roadmap/#stage-6
