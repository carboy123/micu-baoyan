- id: stage-1
  label: 大一
  title: 摸清规则，打好基础
  description: 稳定课程成绩，衔接四六级，跟随工作室开始训练并接触科研。
  link: basics/roadmap/#stage-1
- id: stage-2
  label: 大二
  title: 备赛与科研并行
  description: 六级争取500+，按工作室规划备赛参赛，推进项目与论文产出。
  link: basics/roadmap/#stage-2
- id: stage-3
  label: 大三上
  title: 判断资格，准备申请
  description: 判断资格与加分差距，推进论文和英语，准备申请材料与考核。
  link: basics/roadmap/#stage-3
- id: stage-4
  label: 大三下至暑假
  title: 补足加分，申请夏令营
  description: 有缺口时按工作室规划争取有效加分，同时开展院校申请与面试。
  link: basics/roadmap/#stage-4
- id: stage-5
  label: 申请季
  title: 跟进资格与确认
  description: 跟进校内资格、院校考核与系统确认事项。
  link: basics/roadmap/#stage-5
- id: stage-6
  label: 拟录取后
  title: 完成学业，衔接科研
  description: 完成本科学业，关注后续审核，结合研究方向继续学习。
  link: basics/roadmap/#stage-6
